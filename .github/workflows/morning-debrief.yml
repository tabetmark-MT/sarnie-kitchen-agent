name: Morning Debrief

# Guarantees Mark's 10am debrief even when the free Render instance is asleep —
# the request itself wakes it. GitHub cron is UTC and can't follow DST, so we
# fire at 08:05, 09:05 and 10:05 UTC; the endpoint only sends at/after 10am
# London and only once per day, so exactly one message goes out year-round
# (10:05 BST in summer, 10:05 GMT in winter).
# Reuses the BACKUP_URL secret (same WEBHOOK_SECRET path) — no new secret needed.
# Minutes are deliberately odd and off the hour. GitHub queues scheduled
# runs and drops them under load, worst at :00 — on 23 Sep 2026 this
# workflow and two others did not fire at all that day. The Render
# in-process cron covered it, but the redundancy only helps if both
# halves actually run. An uncontended minute is free reliability.
on:
  schedule:
    - cron: '21 8,9,10 * * *'
  workflow_dispatch: {}

jobs:
  debrief:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning debrief
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
        run: |
          # BACKUP_URL still holds the legacy form:
          #   https://<host>/tasks/backup/<secret>
          # Split it so the secret travels in a header instead of the path.
          # add-mask is required: GitHub masks the whole secret string in
          # logs, but NOT a substring of it, and the secret alone is one.
          base="${BACKUP_URL%/tasks/*}"
          secret="${BACKUP_URL##*/}"
          echo "::add-mask::$secret"
          url="$base/tasks/debrief"
          echo "Calling debrief endpoint (cold start can take ~60s)…"
          body=$(curl -s --max-time 180 -H "Authorization: Bearer $secret" "$url")
          echo "Response: $body"
          echo "$body" | grep -qE '"ok":true|"skipped":true' || { echo "::error::Debrief did not report success"; exit 1; }
          echo "✅ Debrief endpoint responded"
